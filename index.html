<header><h1>2026학년도 창원캠퍼스 교육과정</h1><a href="https://www.changwon.ac.kr/common/nttPdfView.do?fileKey=fd6e24ce242bc279a9e26b4daa77a1fc&amp;rs=" target="_blank" rel="noopener">원문 PDF</a></header>
<section aria-label="교육과정 질문"><div id="archives"></div><div class="chat-tools"><button type="button" id="newRoom">새 대화</button></div><p id="roomNotice" class="turn-notice" role="status" hidden></p><div id="chatlog" aria-live="off"></div><form id="chat"><label for="q">교육과정 질문</label><textarea id="q" maxlength="3000" required></textarea><div class="bar"><span class="status" id="cs" role="status"></span><button id="send">질문하기</button></div></form></section>
<details class="panel" id="auditPanel"><summary>컴퓨터공학과 학생용 · 엑셀로 이수요건 확인</summary><form id="upload">
<div class="grid"><label>적용 교육과정 연도<input type="number" name="year" value="2026" min="2000" max="2100" required></label>
<label>본인 주전공<select id="department" name="department" required><option value="" selected>선택해 주세요</option><option>컴퓨터공학과</option><option>다른 학과</option></select></label><label>이수 유형<select name="track"><option>단일전공</option><option>부전공</option><option>복수전공</option><option>연계전공</option><option>융합전공</option></select></label>
<label>학생 유형<select name="admission"><option>일반</option><option>편입</option><option>전과</option><option>재입학</option></select></label>
<label>엑셀 종류<select name="mode"><option value="list">이수 완료 과목 목록</option><option value="transcript">성적표</option></select></label></div>
<label>학수번호 또는 과목명이 있는 엑셀 파일<input type="file" name="workbook" accept=".xlsx" required></label>
<label class="check"><input type="checkbox" name="complete" checked> 전체 이수내역</label>
<label class="check"><input type="checkbox" name="english_exempt"> 대학영어 이수면제 확인됨</label>
<label class="check"><input type="checkbox" name="international"> 외국인 유학생</label>
<div class="bar"><span class="status" id="us" role="status"></span><button id="runAudit">판정하기</button></div></form><div id="auditResult"></div></details>
</main><script src="./answer-view-0dbe6c6209ad3d0a.js"></script><script>
const el=id=>document.getElementById(id);
let auditId=null, auditVersion=0, roomId=null, roomClosed=false;
function requireNewRoom(message) {
  roomClosed=true;
  el('roomNotice').textContent=message;
  el('roomNotice').hidden=false;
  el('send').disabled=true;
}
function nextRoom() {
  const log=el('chatlog');
  if (log.childElementCount) {
    const archive=add(el('archives'),'details');
    add(archive,'summary','이전 대화 · '+(log.querySelector('h3')?.textContent||'').slice(0,48));
    while (log.firstChild) archive.append(log.firstChild);
  }
  roomId=null; roomClosed=false;
  el('roomNotice').hidden=true;el('roomNotice').textContent='';
  el('cs').textContent='';el('send').disabled=false;
}
el('newRoom').onclick=()=>{
  nextRoom();auditId=null;auditVersion++;
  el('upload').reset();el('auditResult').replaceChildren();el('us').textContent='';
  el('q').focus();
};
el('upload').addEventListener('change',()=>{
  if(auditId) nextRoom();
  auditId=null;auditVersion++;el('auditResult').replaceChildren();el('us').textContent='';
});
function add(parent,tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;parent.append(n);return n}
function refs(parent,pages,interviews=[],doc='excerpt'){const r=add(parent,'div',undefined,'refs');for(const p of pages){const a=add(r,'a',(doc==='university-2026'?'원본 ':'발췌 ')+p+'쪽');a.href=studentSource(doc,p);a.target='_blank';a.rel='noopener'}if(interviews.length)add(r,'span','조교 인터뷰 '+interviews.join(', '))}
function table(parent,headers,rows){const box=add(parent,'div',undefined,'scroll');const t=add(box,'table');const h=add(t,'tr');for(const c of headers)add(h,'th',c);for(const row of rows){const tr=add(t,'tr');for(const x of row)add(tr,'td',String(x??''))}}
el('chat').onsubmit=async e=>{e.preventDefault();const question=el('q').value.trim();if(!question||roomClosed||el('send').disabled)return;
el('send').disabled=true;el('newRoom').disabled=true;el('runAudit').disabled=true;
const deadline=chatDeadline();
const turn=add(el('chatlog'),'article',undefined,'turn');add(turn,'h3',question);const a=add(turn,'div','', 'answer');let pages=[],interviews=[],rows=[],documentId='excerpt',finished=false;
try{const response=await studentApi('/api/chat',{method:'POST',signal:deadline.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({question,audit_id:auditId,conversation_id:roomId})});
if(!response.ok){
 const error=await response.json();const detail=error.detail;
 if(detail&&['room_limit','room_expired','attachment_changed'].includes(detail.code))requireNewRoom(detail.message);
 throw Error(typeof detail==='string'?detail:(detail?.message||'요청 실패 '+response.status));
}
el('q').value='';const reader=response.body.pipeThrough(new TextDecoderStream()).getReader();let buffer='';
stream: while(true){const chunk=await reader.read();if(chunk.done)break;buffer+=chunk.value;let at;
while((at=buffer.indexOf('\n\n'))!==-1){const lines=buffer.slice(0,at).split('\n');buffer=buffer.slice(at+2);const event=lines[0].slice(7);const data=JSON.parse(lines[1].slice(6));
if(event==='conversation'){roomId=data.id}
else if(event==='delta'){if(data.text.trim())deadline.bodyStarted();el('cs').textContent='답변 중';a.append(document.createTextNode(data.text))}
else if(event==='status')el('cs').textContent=data.stage+' 중';
else if(event==='sources'){pages=data.pages;interviews=data.interview_refs||[];documentId=data.document||'excerpt'}else if(event==='rows')rows=data.rows;
else if(event==='done'){finished=true;renderCompletedAnswer(a);el('cs').textContent='답변 완료';
 if(data.conversation?.can_continue===false)requireNewRoom('대화 길이 한도에 도달했습니다. 새 대화에서 이어서 질문해 주세요.');
 break stream}else if(event==='error')throw Error(data.type==='DeadlineExceeded'?data.detail:data.stage+' 단계에서 응답을 마치지 못했습니다.')}}if(!finished)throw Error('응답 연결이 중단됐습니다.');
refs(turn,pages,interviews,documentId);if(rows.length){const d=add(turn,'details');add(d,'summary','조회한 전체 목록 ('+rows.length+')');table(d,['쪽','항목'],rows.map(r=>[r.page,r.text]))}
}catch(err){const msg=deadline.message||err.message;add(turn,'p',(a.textContent?'답변 중단 · ':'')+msg,'turn-notice');el('cs').textContent=roomClosed?'':'다시 질문할 수 있습니다.';
}finally{
 deadline.close();el('send').disabled=roomClosed;el('newRoom').disabled=false;el('runAudit').disabled=false;
 if(roomClosed)el('newRoom').focus();else el('q').focus();
}};
const scopeNotice='개인 이수요건 판정은 컴퓨터공학과 학생이 이용할 수 있습니다. 모든 학과의 편람 기준은 채팅에서 확인할 수 있습니다.';
el('department').onchange=()=>{const outside=el('department').value==='다른 학과';
const input=el('upload').elements.workbook;input.disabled=outside;el('us').textContent=outside?scopeNotice:'';
if(outside){input.value='';++auditVersion;if(auditId&&(roomId||roomClosed))nextRoom();auditId=null;el('auditResult').replaceChildren()}};
el('upload').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;
if(form.elements.department.value!=='컴퓨터공학과'){el('us').textContent=scopeNotice;return}
const fd=new FormData(form);for(const k of ['complete','english_exempt','international'])fd.set(k,String(form.elements[k].checked));
if(roomId||roomClosed)nextRoom();
auditId=null;const version=++auditVersion;el('newRoom').disabled=true;el('runAudit').disabled=true;el('send').disabled=true;el('us').textContent='이수내역 확인 중';const box=el('auditResult');box.replaceChildren();
try{const r=await studentApi('/api/audit',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'입력을 확인해 주세요.');
if(version!==auditVersion)return;auditId=data.audit_id;
if(data.supported===false){el('us').textContent=scopeNotice;return}
const coursework=data.coursework_status,cert=data.graduation_certification;
add(box,'h3','학점·과목 이수요건 · '+coursework,coursework==='충족'?'ok':coursework==='미충족'?'fail':'review');
add(box,'p',data.profile);add(box,'h3','졸업인증 · '+cert.status,'review');add(box,'p',cert.evidence);
if(cert.pages.length)refs(box,cert.pages,[],cert.document);
if(data.rules.length)table(box,['요건','판정','인정 / 필요','부족·확인 항목','원문'],data.rules.map(x=>[x.label,x.status,x.earned!=null?x.earned+' / '+x.required:'',x.missing_items?.join(', ')||[x.missing?x.missing+'학점':'',x.details].filter(Boolean).join(' · '),x.pages.join(', ')+'쪽']));
if(data.issues.length){const d=add(box,'details');d.open=true;add(d,'summary','확인할 이수내역');table(d,['위치','과목','사유'],data.issues.map(x=>[x.row,x.course,x.reason]))}
if(data.recognized.length){const d=add(box,'details');add(d,'summary','인정 과목 ('+data.recognized.length+')');table(d,['학수번호','과목','학점','구분'],data.recognized.map(x=>[x.code,x.name,x.credits,x.category]))}
refs(box,data.pages,[],data.source_document);el('us').textContent='판정 완료'}catch(err){el('us').textContent=err.message}finally{el('runAudit').disabled=false;el('newRoom').disabled=false;el('send').disabled=roomClosed}};
</script></body></html>
